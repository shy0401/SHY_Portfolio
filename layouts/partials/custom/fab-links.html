{{ $isKo := eq site.Language.Lang "ko" }}
<nav class="fab-dock" aria-label="{{ if $isKo }}빠른 이동 링크{{ else }}Quick action links{{ end }}">
  <a href="{{ site.Params.github }}" target="_blank" rel="noopener" aria-label="GitHub"><i class="fab fa-github"></i></a>
  <a href="{{ "projects/" | relLangURL }}" aria-label="{{ if $isKo }}프로젝트{{ else }}Projects{{ end }}"><i class="fas fa-folder-open"></i></a>
  <a href="{{ "awards/certificates/" | relLangURL }}" aria-label="{{ if $isKo }}수상 및 자격 증빙{{ else }}Awards and certificates{{ end }}"><i class="fas fa-award"></i></a>
  <a href="{{ "contact/social-links/" | relLangURL }}" aria-label="{{ if $isKo }}연락처{{ else }}Contact{{ end }}"><i class="fas fa-address-card"></i></a>
  <a href="{{ site.Params.instagram }}" target="_blank" rel="noopener" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
  <a href="#top" aria-label="{{ if $isKo }}맨 위로{{ else }}Back to top{{ end }}"><i class="fas fa-arrow-up"></i></a>
</nav>
