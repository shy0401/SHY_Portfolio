{{ define "main" }}
<section class="page-shell compact">
  <article class="page-hero">
    <p class="eyebrow">{{ .CurrentSection.LinkTitle }}</p>
    <h1>{{ .Title }}</h1>
    <div class="page-meta">
      {{ with .Date }}
        <span>{{ .Format "2006.01.02" }}</span>
      {{ end }}
      <span>{{ .Lang }}</span>
    </div>
    <div class="page-content">
      {{ .Content }}
    </div>
    {{ with .CurrentSection }}
      <a class="section-link" href="{{ .RelPermalink }}">{{ T "page_back" }}</a>
    {{ end }}
  </article>
</section>
{{ end }}
